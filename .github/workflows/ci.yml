name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, format, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run validation
        run: |
          case "${{ matrix.task }}" in
            lint)      ruff check . ;;
            typecheck) mypy src ;;
            format)    black --check . ;;
            test)      pytest -q ;;
          esac
