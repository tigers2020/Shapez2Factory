# Narrow RTTP macro track gate (lab web + runtime + pipeline).
# Full-repo ruff/mypy/black remains in ci.yml (hygiene track).
name: rttp-lab-macro-smoke

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  macro-smoke:
    runs-on: ubuntu-latest
    env:
      DJANGO_USE_SQLITE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: RTTP macro smoke (lab)
        run: |
          python -m pytest \
            tests/unit/web/test_asteroid_lab_page_context.py \
            tests/integration/asteroid_lab/test_rttp_run_solver_macro_integration.py \
            tests/unit/asteroid_lab/test_rttp_pipeline_macro_greenfield.py \
            tests/unit/asteroid_lab/test_macro_commit_hud.py \
            tests/unit/asteroid_lab/test_run_solver_management_command.py \
            tests/integration/web/test_asteroid_run_solver.py -k "macro"
