# Post-decontamination lab smoke (reconstruction slice + layer stack gates).
# Full-repo ruff/mypy/black remains in ci.yml (hygiene track).
name: rttp-lab-macro-smoke

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  macro-smoke:
    runs-on: ubuntu-latest
    env:
      DJANGO_USE_SQLITE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lab reconstruction smoke
        run: |
          python -m pytest \
            tests/unit/asteroid_lab/layers/ \
            tests/unit/architecture/test_reconstruction_decontamination_gates.py \
            tests/unit/asteroid_lab/test_solver_decontamination_stub.py \
            tests/unit/asteroid_lab/test_run_solver_management_command.py
