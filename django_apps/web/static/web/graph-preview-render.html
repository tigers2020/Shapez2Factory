<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Graph Preview Prerender</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b1c;
      }

      body {
        display: grid;
        place-items: center;
      }

      /* Prerender PNG size follows [data-shape-gltf-viewport] (512×512); Playwright viewport must fit `.frame`. */
      .frame {
        width: 672px;
        height: 672px;
        display: grid;
        place-items: center;
      }

      .viewer-shell {
        width: 592px;
        padding: 40px;
        border-radius: 80px;
        background: rgba(15, 23, 42, 0.05);
      }

      [data-shape-gltf-viewport] {
        width: 512px;
        height: 512px;
        min-height: 512px;
        overflow: hidden;
        border-radius: 999px;
        background: #070b1c;
      }

      html.shape-prerender-transparent,
      html.shape-prerender-transparent body {
        background: transparent;
      }

      html.shape-prerender-transparent .viewer-shell {
        background: transparent;
      }

      html.shape-prerender-transparent [data-shape-gltf-viewport] {
        background: transparent;
        /* Square bake for atomic sprites — avoid circular clip from border-radius. */
        border-radius: 0;
      }

      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/0.184.0/build/three.module.js",
          "three/addons/": "/vendor/three/0.184.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="frame">
      <div class="viewer-shell">
        <div data-shape-gltf-viewer data-asset-base="/vendor/shapez-vortex/models/shapes/">
          <div data-prerender-viewport data-shape-gltf-viewport></div>
          <script type="application/json">{}</script>
        </div>
      </div>
    </div>
    <script type="module">
      import { mountShapeGltfViewer } from "/js/shape_gltf_viewer.js";

      const response = await fetch("/scene.json", { cache: "no-store" });
      const scene = await response.json();
      if (scene.transparent_background) {
        document.documentElement.classList.add("shape-prerender-transparent");
      }
      const viewer = document.querySelector("[data-shape-gltf-viewer]");
      const script = viewer.querySelector('script[type="application/json"]');
      script.textContent = JSON.stringify(scene);
      await mountShapeGltfViewer(viewer);
      await new Promise((resolve) => setTimeout(resolve, 250));
      document.body.dataset.prerenderReady = "true";
    </script>
  </body>
</html>
