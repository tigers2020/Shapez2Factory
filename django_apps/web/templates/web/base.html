{% load i18n static %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" class="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% trans "shapez2 planner" %}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'web/img/branding/logo-3.png' %}">
    <link rel="stylesheet" href="{% static 'web/css/app.css' %}?v=lab-inspector-grid-2026-06-12">
    {% block extra_css %}
    {% endblock extra_css %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    <script src="{% url 'javascript-catalog' %}"></script>
    <script src="{% static 'web/js/ui_locale.js' %}"></script>
    <script src="{% static 'web/js/flowbite.min.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
