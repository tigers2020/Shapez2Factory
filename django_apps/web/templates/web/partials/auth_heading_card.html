{% load static i18n %}
<div class="flex items-start gap-3">
  <img
    src="{% static 'web/img/branding/logo-3.png' %}"
    alt=""
    width="40"
    height="40"
    class="mt-0.5 h-10 w-10 shrink-0 rounded-lg border border-cyan-400/35 bg-slate-950 object-contain p-0.5"
    decoding="async"
  />
  <div class="min-w-0 flex-1">
    <p class="text-xs font-semibold uppercase tracking-widest text-cyan-300">{% trans "Account" %}</p>
    <h1 class="mt-1 text-3xl font-semibold text-slate-50">{{ title }}</h1>
    {% if subtitle %}
      <p class="mt-2 rounded-md bg-slate-950/75 px-2.5 py-1.5 text-sm leading-snug text-slate-300 ring-1 ring-slate-700/70">
        {{ subtitle }}
      </p>
    {% endif %}
  </div>
</div>
