{% load static %}
{% with current=request.resolver_match.url_name|default:"" %}
  {% if nav_tone == "mono" %}
    <header class="border-b border-neutral-800 bg-neutral-950/95 backdrop-blur">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-4 px-4 py-3 sm:px-6 sm:py-4 lg:px-8">
        <div class="flex flex-1 items-center">
          <a href="{% url 'web:home' %}" class="flex items-center gap-3 text-neutral-100 no-underline hover:text-indigo-300">
            <img
              src="{% static 'web/img/branding/logo-3.png' %}"
              alt=""
              width="36"
              height="36"
              class="h-9 w-9 shrink-0 rounded-sm border border-neutral-700 bg-neutral-900 object-contain"
              style="padding: 1px"
              decoding="async"
            />
            <span class="text-sm font-semibold tracking-wide text-neutral-100">shapez2 planner</span>
          </a>
        </div>

        <nav class="flex flex-1 flex-wrap items-center justify-center gap-1 text-sm font-medium md:gap-1" aria-label="Primary">
          <a
            href="{% url 'web:home' %}"
            class="rounded-sm px-3 py-2 no-underline {% if current == 'home' %}text-indigo-300{% else %}text-neutral-500{% endif %} hover:text-indigo-200"
            {% if current == "home" %}aria-current="page"{% endif %}
          >Home</a>
          <a
            href="{% url 'web:gallery' %}"
            class="rounded-sm px-3 py-2 no-underline {% if current == 'gallery' %}text-indigo-300{% else %}text-neutral-500{% endif %} hover:text-indigo-200"
            {% if current == "gallery" %}aria-current="page"{% endif %}
          >Gallery</a>
          <a
            href="{% url 'web:demo' %}"
            class="rounded-sm px-3 py-2 no-underline {% if current == 'demo' %}text-indigo-300{% else %}text-neutral-500{% endif %} hover:text-indigo-200"
            {% if current == "demo" %}aria-current="page"{% endif %}
          >Demo</a>
        </nav>

        <div class="flex flex-1 items-center justify-end">
          <span
            class="inline-flex items-center justify-center rounded-sm border border-neutral-800 bg-neutral-900 px-4 py-2 text-sm font-semibold text-neutral-500"
            aria-disabled="true"
          >GitHub soon</span>
        </div>
      </div>
    </header>
  {% else %}
    <header class="border-b border-slate-800 bg-slate-950/95 backdrop-blur">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-4 px-4 py-3 sm:px-6 sm:py-4 lg:px-8">
        <div class="flex flex-1 items-center">
          <a href="{% url 'web:home' %}" class="flex items-center gap-3 text-slate-100 no-underline hover:text-cyan-200">
            <img
              src="{% static 'web/img/branding/logo-3.png' %}"
              alt=""
              width="36"
              height="36"
              class="h-9 w-9 shrink-0 rounded-xl border border-cyan-400/30 bg-slate-950 object-contain"
              style="padding: 1px"
              decoding="async"
            />
            <span class="text-sm font-semibold tracking-wide text-slate-100">shapez2 planner</span>
          </a>
        </div>

        <nav class="flex flex-1 flex-wrap items-center justify-center gap-1 text-sm font-medium md:gap-1" aria-label="Primary">
          <a
            href="{% url 'web:home' %}"
            class="rounded-lg px-3 py-2 no-underline {% if current == 'home' %}text-cyan-200{% else %}text-slate-400{% endif %} hover:text-cyan-300"
            {% if current == "home" %}aria-current="page"{% endif %}
          >Home</a>
          <a
            href="{% url 'web:gallery' %}"
            class="rounded-lg px-3 py-2 no-underline {% if current == 'gallery' %}text-cyan-200{% else %}text-slate-400{% endif %} hover:text-cyan-300"
            {% if current == "gallery" %}aria-current="page"{% endif %}
          >Gallery</a>
          <a
            href="{% url 'web:demo' %}"
            class="rounded-lg px-3 py-2 no-underline {% if current == 'demo' %}text-cyan-200{% else %}text-slate-400{% endif %} hover:text-cyan-300"
            {% if current == "demo" %}aria-current="page"{% endif %}
          >Demo</a>
        </nav>

        <div class="flex flex-1 items-center justify-end">
          <span
            class="inline-flex items-center justify-center rounded-xl border border-slate-800 bg-slate-900 px-4 py-2 text-sm font-semibold text-slate-500"
            aria-disabled="true"
          >GitHub soon</span>
        </div>
      </div>
    </header>
  {% endif %}
{% endwith %}
