{% load i18n static %}
<div class="p-5 sm:p-7">
  {% if tab.kind == "bch" %}
    <h2 class="text-2xl font-bold tracking-tight text-white sm:text-3xl">{% trans "Receive BCH" %}</h2>
    <p class="mt-1 text-base font-medium leading-relaxed text-slate-400 sm:text-lg">
      {% trans "on the Bitcoin Cash network" %}
    </p>
  {% else %}
    <h2 class="text-2xl font-bold tracking-tight text-white sm:text-3xl">{% trans "Receive ETH" %}</h2>
    <p class="mt-1 text-base font-medium leading-relaxed text-slate-400 sm:text-lg">
      {% trans "on the Ethereum network" %}
    </p>
  {% endif %}

  <div class="support-crypto-card-stack">
  <div
    class="relative overflow-visible rounded-2xl"
    style="min-height: 176px; background-color: {% if tab.kind == 'bch' %}rgb(141, 195, 81){% else %}rgb(98, 126, 234){% endif %};"
  >
    <div class="absolute bottom-6 left-4 flex h-6 w-6 items-center justify-center rounded-full bg-white/95">
      <span
        class="block h-3 w-3 rounded-full"
        style="background-color: {% if tab.kind == 'bch' %}rgb(141, 195, 81){% else %}rgb(98, 126, 234){% endif %};"
        aria-hidden="true"
      ></span>
    </div>

    <div
      class="absolute flex items-center justify-center rounded-2xl bg-white p-2 shadow-xl shadow-black/25"
      style="right: -4px; top: 0; width: 176px; height: 176px; border: 7px solid #000;"
    >
      <img
        src="{% static tab.qr_static %}"
        alt="{% if tab.kind == 'bch' %}{% trans 'QR code for Bitcoin Cash donation address' %}{% else %}{% trans 'QR code for Ethereum donation address' %}{% endif %}"
        width="148"
        height="148"
        class="block"
        style="width: 148px; height: 148px;"
        decoding="async"
        loading="lazy"
      />
      <span
        class="absolute flex h-10 w-10 items-center justify-center overflow-hidden rounded-full"
        style="left: 50%; top: 50%; transform: translate(-50%, -50%); background-color: {% if tab.kind == 'bch' %}rgb(141, 195, 81){% else %}rgb(98, 126, 234){% endif %};"
        aria-hidden="true"
      >
        <img
          src="{% static tab.logo_static %}"
          alt=""
          width="28"
          height="28"
          class="h-7 w-7 object-contain"
          decoding="async"
          loading="lazy"
        />
      </span>
    </div>
  </div>

  <div class="flex items-center justify-between gap-4" data-address-card>
    <div class="min-w-0">
      <p class="text-base font-bold leading-tight text-white">{% trans "Your address" %}</p>
      <code
        class="mt-1 block truncate font-mono text-base leading-tight text-slate-500"
        translate="no"
      >{{ tab.address }}</code>
      <p class="support-copy-feedback mt-2 hidden text-xs font-medium text-slate-300" aria-live="polite"></p>
    </div>
    <button
      type="button"
      class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-slate-800 text-white transition hover:bg-slate-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-500"
      data-copy-address="{{ tab.address }}"
      data-copied-label="{% trans 'Copied.' %}"
      aria-label="{% trans 'Copy address' %}"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8 16H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2m-6 12h8a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2z"
        />
      </svg>
    </button>
  </div>
  </div>
</div>
