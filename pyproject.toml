[project]
name = "shapez2-factory-planner"
version = "0.1.0"
description = "shapez2 Factory Planner"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "django>=5.2,<6.0",
    "django-allauth",
    "dj-database-url",
    "python-dotenv",
    "whitenoise",
    "jsonschema",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "pytest>=8.0.0",
    "pytest-django",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

