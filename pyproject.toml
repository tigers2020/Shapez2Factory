[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shapez2-solver"
version = "0.1.0"
description = "Django scaffold for a shapez 2 factory planner."
readme = "structure.md"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=2.3,<3.0",
    "django>=5.2,<6.0",
    "polib>=1.2,<2.0",
    "pillow>=10,<12",
    "django-allauth[socialaccount]>=65.0,<66.0",
    "gunicorn>=23.0,<24.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "whitenoise>=6.9,<7.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
cache_dir = "C:/tmp/shapez2solver-mypy-cache"
exclude = "(^django_apps/.*/migrations/|^tests/integration/|^build/)"

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dj_database_url"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "config.*",
    "manage",
    "django_apps.shapez_core.apps",
    "django_apps.shapez_core.urls",
    "django_apps.shapez_core.views",
    "django_apps.shapez_asteroid.admin",
    "django_apps.shapez_asteroid.apps",
    "django_apps.shapez_asteroid.models",
    "django_apps.shapez_asteroid.urls",
    "django_apps.shapez_asteroid.views",
    "django_apps.shapez_solver.admin",
    "django_apps.shapez_solver.apps",
    "django_apps.shapez_solver.models",
    "django_apps.web.admin",
    "django_apps.web.apps",
    "django_apps.web.social_adapter",
    "django_apps.web.socialaccount_forms",
    "django_apps.web.urls",
    "django_apps.web.views",
    "django_apps.web.views.macro_staff",
    "django_apps.web.views.public_pages",
]
ignore_errors = true
