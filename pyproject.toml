[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shapez2-solver"
version = "0.1.0"
description = "Django scaffold for a shapez 2 factory planner."
readme = "documents/meta/shapez_core_solver_dev_plan.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "django-allauth[socialaccount]>=65.0,<66.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "polib",
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["django_apps*", "config"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
cache_dir = "C:/tmp/shapez2solver-mypy-cache"
exclude = "(^django_apps/.*/migrations/|^tests/integration/)"

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "config.*",
    "manage",
    "django_apps.shapez_core.apps",
    "django_apps.shapez_core.urls",
    "django_apps.shapez_core.views",
    "django_apps.shapez_solver.admin",
    "django_apps.shapez_solver.apps",
    "django_apps.shapez_solver.models",
    "django_apps.shapez_solver.urls",
    "django_apps.shapez_solver.views",
    "django_apps.web.apps",
    "django_apps.web.social_adapter",
    "django_apps.web.socialaccount_forms",
    "django_apps.web.urls",
    "django_apps.web.views",
    "tests.unit.shapez_solver.*",
]
ignore_errors = true
