[project]
name = "shapez2_factory"
version = "0.1.0"
description = "shapez2 Factory Planner"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-xdist>=3.5.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "graphify-out",
    "django_apps/game_data/graphify-out",
    "build",
    "dist",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/(\\.git|\\.venv|graphify-out|django_apps/game_data/graphify-out)/"

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
