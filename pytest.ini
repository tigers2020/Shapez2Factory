[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
# 동일 베이스명 테스트 모듈 충돌 방지 (예: unit/integration test_health.py)
# --reuse-db: Django 테스트 DB를 유지해 반복 실행 시 마이그레이션 1회 부담(스키마 변경 후 한 번은 --create-db).
addopts = --import-mode=importlib --reuse-db

# Path-based (see tests/conftest.py); use: pytest -m <marker>
markers =
    unit: 빠른 단위 테스트 (tests/unit)
    integration: Django/HTTP 등 통합 테스트 (tests/integration)
    shapez_core: shapez_core 관련 (tests/*/shapez_core)
    shapez_solver: shapez_solver 관련 (tests/*/shapez_solver)
    web: 웹·템플릿 통합 (tests/*/web)
    api: API 통합 (tests/*/api)
    asteroid_lab: asteroid_lab ORM·어드민 (tests/*/asteroid_lab)
