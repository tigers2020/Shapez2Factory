[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests

# Path-based (see tests/conftest.py); use: pytest -m <marker>
markers =
    unit: 빠른 단위 테스트 (tests/unit)
    integration: Django/HTTP 등 통합 테스트 (tests/integration)
    shapez_core: shapez_core 관련 (tests/*/shapez_core)
    shapez_solver: shapez_solver 관련 (tests/*/shapez_solver)
    web: 웹·템플릿 통합 (tests/*/web)
    api: API 통합 (tests/*/api)
